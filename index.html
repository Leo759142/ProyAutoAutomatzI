<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node Editor</title>
    <link rel="stylesheet" href="/src/style.css">
    <script src="https://sql.js.org/dist/sql-wasm.js"></script>
</head>
<body>
    <div id="app">
        <div id="toolbar">
            <div class="toolbar-section">
                <button id="addNode">Add Node (+)</button>
                <button id="clearCanvas">Clear Canvas</button>
            </div>
            <div class="toolbar-section execution">
                <button id="playButton" class="execution-button play">
                    <span>▶</span>
                    <span>Play</span>
                </button>
                <button id="stopButton" class="execution-button stop" disabled>
                    <span>⬛</span>
                    <span>Stop</span>
                </button>
            </div>
            <div class="toolbar-section node-types">
                <select id="nodeTypeSelect">
                    <option value="">Select Node Type...</option>
                    <optgroup label="Input/Output">
                        <option value="number">Number Input</option>
                        <option value="boolean">Boolean Input</option>
                        <option value="display">Display</option>
                    </optgroup>
                    <optgroup label="Logic">
                        <option value="and">AND</option>
                        <option value="or">OR</option>
                        <option value="not">NOT</option>
                    </optgroup>
                    <optgroup label="Comparison">
                        <option value="greater">Greater Than</option>
                        <option value="equals">Equals</option>
                    </optgroup>
                </select>
            </div>
            <div class="toolbar-section">
                <select id="templateSelect">
                    <option value="">Seleccionar Template</option>
                </select>
                <button id="loadTemplate">Cargar Template</button>
            </div>
            <div class="tools">
                <span>Tools:</span>
                <span>Press 'A' to add node</span>
                <span>Middle mouse to pan</span>
                <span>Mouse wheel to zoom</span>
                <span>Delete to remove selected</span>
            </div>
        </div>
        <canvas id="nodeCanvas"></canvas>
        <div class="canvas-overlay">
            <span><span class="label">Coords:</span><span id="coordinates">0, 0</span></span>
            <span class="zoom-control">
                <span class="label">Zoom:</span>
                <input type="range" id="zoomRange" min="90" max="110" value="20" step="1">
                <span id="zoom">100%</span>
            </span>
            <span><span class="label">Mode:</span><span id="mode">Select</span></span>
        </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
